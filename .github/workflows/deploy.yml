name: Deploy site

on:
  push:
    branches:
      - master
      - main
      - al-folio-rebuild
  pull_request:
    branches:
      - master
      - main
      - al-folio-rebuild
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Ensure GitHub Pages uses workflow deployments
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PAGES_ADMIN_TOKEN: ${{ secrets.PAGES_ADMIN_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          ref_name = os.environ["GITHUB_REF_NAME"]
          read_token = os.environ["GITHUB_TOKEN"]
          admin_token = os.environ.get("PAGES_ADMIN_TOKEN", "").strip()
          token = admin_token or read_token
          can_manage_pages = bool(admin_token)
          url = f"https://api.github.com/repos/{repo}/pages"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2026-03-10",
          }

          def request(method, payload=None):
              data = None if payload is None else json.dumps(payload).encode("utf-8")
              req = urllib.request.Request(url, data=data, headers=headers, method=method)
              with urllib.request.urlopen(req) as response:
                  body = response.read().decode("utf-8")
                  return response.status, json.loads(body) if body else None

          desired = {"build_type": "workflow", "source": {"branch": ref_name, "path": "/"}}

          try:
              _, current = request("GET")
              build_type = current.get("build_type")
              source = current.get("source") or {}
              print(f"Current Pages config: build_type={build_type}, source={source}")

              if build_type == "workflow":
                  print("GitHub Pages is already configured for workflow deployments.")
              elif not can_manage_pages:
                  print(
                      "::notice::PAGES_ADMIN_TOKEN is not configured, so the workflow can only verify "
                      "the current GitHub Pages mode and cannot change it automatically."
                  )
              else:
                  try:
                      request("PUT", desired)
                      print(f"::notice::Updated GitHub Pages to workflow mode on branch '{ref_name}'.")
                  except urllib.error.HTTPError as error:
                      details = error.read().decode("utf-8", errors="replace")
                      print(
                          "::warning::GitHub Pages is not in workflow mode and the workflow could not update it "
                          f"automatically ({error.code}). Response: {details}"
                      )
          except urllib.error.HTTPError as error:
              details = error.read().decode("utf-8", errors="replace")
              if error.code == 404:
                  if not can_manage_pages:
                      print(
                          "::notice::GitHub Pages is not configured yet and PAGES_ADMIN_TOKEN is not "
                          "configured, so the workflow cannot create the Pages site automatically."
                      )
                  else:
                      try:
                          request("POST", desired)
                          print(f"::notice::Created a GitHub Pages site in workflow mode on branch '{ref_name}'.")
                      except urllib.error.HTTPError as create_error:
                          create_details = create_error.read().decode("utf-8", errors="replace")
                          print(
                              "::warning::GitHub Pages is not configured yet and the workflow could not create it "
                              f"automatically ({create_error.code}). Response: {create_details}"
                          )
              else:
                  print(
                      "::warning::Could not inspect GitHub Pages settings before deployment "
                      f"({error.code}). Response: {details}"
                  )

          try:
              _, current = request("GET")
              build_type = current.get("build_type")
              source = current.get("source") or {}
              print(f"Final Pages config: build_type={build_type}, source={source}")
          except urllib.error.HTTPError as error:
              details = error.read().decode("utf-8", errors="replace")
              print(
                  "::error::Could not verify GitHub Pages configuration after the update attempt "
                  f"({error.code}). Response: {details}"
              )
              sys.exit(1)

          if build_type != "workflow":
              print(
                  "::error::GitHub Pages must use GitHub Actions for this repository. "
                  "The built-in branch-based Pages builder uses github-pages v232 and does not "
                  "support jekyll-scholar tags such as {% bibliography %}. "
                  "The default GITHUB_TOKEN also cannot switch this setting by itself because the "
                  "Pages API requires repository administration permission. Either set "
                  "Settings -> Pages -> Source to GitHub Actions manually, or add a "
                  "PAGES_ADMIN_TOKEN secret with repo admin access and rerun this workflow."
              )
              sys.exit(1)
          PY
      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.5"
          bundler-cache: true
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Update _config.yml
        uses: fjogeleit/yaml-update-action@main
        with:
          commitChange: false
          valueFile: "_config.yml"
          propertyPath: "giscus.repo"
          value: ${{ github.repository }}
      - name: Install and build
        env:
          JEKYLL_ENV: production
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          python -m pip install --upgrade nbconvert
          bundle exec jekyll build
      - name: Purge unused CSS
        run: |
          npm install -g purgecss
          purgecss -c purgecss.config.js
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
